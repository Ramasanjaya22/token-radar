<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Token Radar</h1>
        <p class="tag">Pre-token protocols, ranked by the value a launch could carry.</p>
      </div>
    </div>
    <dl class="meta" id="meta"></dl>
  </header>

  <section class="model" id="model" aria-labelledby="model-h">
    <h2 id="model-h">The model <span class="pill" id="model-version">radar-2</span></h2>
    <p class="formula" id="formula"></p>
    <p class="note" id="model-note"></p>
  </section>

  <section class="controls" aria-label="Filters">
    <label class="field grow">
      <span>Search</span>
      <input id="q" type="search" placeholder="protocol, category or chain" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Category</span>
      <select id="category"><option value="all">All categories</option></select>
    </label>
    <label class="field">
      <span>Chain</span>
      <select id="chain"><option value="all">All chains</option></select>
    </label>
    <div class="field">
      <span>View</span>
      <div class="tabs" role="tablist">
        <button id="tab-pre" type="button" role="tab" aria-pressed="true">Pre-token</button>
        <button id="tab-live" type="button" role="tab" aria-pressed="false">Live token</button>
      </div>
    </div>
    <button id="reset" type="button" class="ghost">Reset</button>
  </section>

  <main id="board" tabindex="-1">
    <div class="tablewrap">
      <table id="table">
        <caption id="caption"></caption>
        <thead id="head"></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <aside id="detail" class="detail" hidden aria-live="polite"></aside>

  <footer class="foot">
    <p id="foot-note"></p>
  </footer>
</div>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
